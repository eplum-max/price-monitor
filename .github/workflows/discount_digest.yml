name: Weekly Discount Digest

on:
  schedule:
    - cron: '0 1 * * 1'  # Monday 1 AM UTC = Sunday 6 PM Pacific (PDT)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run discount digest monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python discount_monitor.py

      - name: Commit digest history
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digest_history.json
          git commit -m "Update weekly digest history $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          # Retry push with rebase in case the other workflow (jacket monitor)
          # pushed to main at the same time - avoids the "fetch first" rejection
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded"
              break
            fi
            echo "Push rejected (attempt $i/5), pulling and retrying..."
            git pull --rebase origin main
            sleep 3
          done
        continue-on-error: true
