name: Weekly Discount Digest

on:
  schedule:
    # Sunday 6 PM Pacific = Monday 1 AM UTC (PDT is UTC-7, PST is UTC-8)
    # Using 1 AM UTC (1:00) to cover both daylight saving time periods
    # Note: GitHub Actions uses UTC only
    - cron: '0 1 * * 1'  # Monday 1 AM UTC = Sunday 6 PM Pacific (PDT)
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run discount digest monitor
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python discount_monitor.py
      
      - name: Commit digest history
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digest_history.json
          git commit -m "Update weekly digest history $(date -u +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
        continue-on-error: true
